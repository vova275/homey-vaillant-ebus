<!doctype html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .row { display: flex !important; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; cursor: pointer; }
    .row .homey-form-checkbox-checkmark { flex: none; }
    .row .name { flex: 1; }
    .zone { color: #888; font-size: 12px; }
    .val { color: #555; min-width: 56px; text-align: right; }
    #preview { margin: 12px 0; font-weight: 600; }
    .hint { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.title"></h1>
    <p class="homey-subtitle" data-i18n="settings.subtitle"></p>
  </header>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.outdoor"></legend>
    <select id="outdoor" class="homey-form-select"></select>
    <p class="hint" data-i18n="settings.outdoorHint"></p>
  </fieldset>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-i18n="settings.rooms"></legend>
    <div id="rooms" data-i18n="settings.loading"></div>
  </fieldset>

  <div id="preview"></div>
  <button id="save" class="homey-button-primary-full" data-i18n="settings.save"></button>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const el = (id) => document.getElementById(id);
      document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = Homey.__(n.dataset.i18n); });
      const get = (k) => new Promise((res) => Homey.get(k, (e, v) => res(e ? null : v)));
      const set = (k, v) => new Promise((res, rej) => Homey.set(k, v, (e) => (e ? rej(e) : res())));
      const api = (path) => new Promise((res, rej) => Homey.api('GET', path, null, (e, v) => (e ? rej(e) : res(v))));

      async function preview() {
        try {
          const p = await api('/preview');
          el('preview').textContent = `${Homey.__('settings.now')}: ${Homey.__('settings.room')} ${p.room ?? '—'} °C, ${Homey.__('settings.outdoor')} ${p.outdoor ?? '—'} °C`;
        } catch (e) { el('preview').textContent = ''; }
      }

      (async () => {
        const [sensors, rooms, outdoor] = await Promise.all([api('/sensors'), get('roomSensors'), get('outdoorSource')]);
        const chosen = new Set(rooms || []);
        const sel = el('outdoor');
        sel.add(new Option(Homey.__('settings.weather'), 'weather'));
        sel.add(new Option(Homey.__('settings.none'), 'none'));
        sensors.forEach((s) => sel.add(new Option(`${s.zone ? `${s.zone} / ` : ''}${s.name} (${s.value ?? '—'} °C)`, s.id)));
        sel.value = outdoor || 'weather';

        el('rooms').innerHTML = '';
        if (!sensors.length) el('rooms').textContent = Homey.__('settings.noSensors');
        sensors.forEach((s) => {
          const row = document.createElement('label');
          row.className = 'homey-form-checkbox row';
          row.innerHTML = `<input type="checkbox" class="homey-form-checkbox-input" value="${s.id}">
            <span class="homey-form-checkbox-checkmark"></span>
            <span class="homey-form-checkbox-text name">${s.name}<br><span class="zone">${s.zone}</span></span>
            <span class="val">${s.value ?? '—'} °C</span>`;
          row.querySelector('input').checked = chosen.has(s.id);
          el('rooms').appendChild(row);
        });
        Homey.ready();
        preview();
      })().catch((e) => { el('rooms').textContent = `Error: ${e.message || e}`; Homey.ready(); });

      el('save').addEventListener('click', async () => {
        const ids = [...document.querySelectorAll('#rooms input:checked')].map((i) => i.value);
        await set('roomSensors', ids);
        await set('outdoorSource', el('outdoor').value);
        Homey.alert(Homey.__('settings.saved'));
        preview();
      });
    }
  </script>
</body>
</html>
