<style>
  .field { margin-bottom: 12px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field input, .field select { width: 100%; }
  #result { margin-top: 12px; white-space: pre-wrap; font-size: 13px; }
  .hint { color: #888; font-size: 12px; }
</style>

<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.subtitle"></p>
</header>

<form class="homey-form" onsubmit="return false;">
  <div class="field">
    <label for="transport" data-i18n="pair.type"></label>
    <select id="transport" class="homey-form-select">
      <option value="ebusd" data-i18n="pair.ebusd"></option>
      <option value="enhanced" data-i18n="pair.enhanced"></option>
    </select>
  </div>
  <div class="field">
    <label for="host" data-i18n="pair.host"></label>
    <input id="host" class="homey-form-input" type="text" placeholder="192.168.1.50">
  </div>
  <div class="field">
    <label for="port" data-i18n="pair.port"></label>
    <input id="port" class="homey-form-input" type="number" value="8888">
    <div class="hint" data-i18n="pair.portHint"></div>
  </div>
  <div class="field" id="addrField" style="display:none">
    <label for="address" data-i18n="pair.address"></label>
    <input id="address" class="homey-form-input" type="text" value="31">
  </div>
  <button id="go" class="homey-button-primary-full" data-i18n="pair.connect"></button>
  <div id="result"></div>
</form>

<script>
  const el = (id) => document.getElementById(id);
  document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = Homey.__(n.dataset.i18n); });
  el('transport').addEventListener('change', () => {
    const enh = el('transport').value === 'enhanced';
    el('port').value = enh ? 9999 : 8888;
    el('addrField').style.display = enh ? '' : 'none';
  });
  el('go').addEventListener('click', async () => {
    el('go').classList.add('is-loading');
    el('result').textContent = '';
    try {
      const r = await Homey.emit('connect', {
        transport: el('transport').value,
        host: el('host').value.trim(),
        port: el('port').value,
        address: el('address').value.trim(),
      });
      el('result').textContent = `${Homey.__('pair.found')}: ${r.ident.manufacturer} ${r.ident.id} (SW ${r.ident.sw})\n`
        + `${Homey.__('pair.flow')} ${r.state.flowTemp} °C, ${Homey.__('pair.pressure')} ${r.state.pressure} bar`;
      setTimeout(() => Homey.showView('list_devices'), 1200);
    } catch (err) {
      el('result').textContent = `${Homey.__('pair.failed')}: ${err.message || err}`;
    } finally {
      el('go').classList.remove('is-loading');
    }
  });
</script>
