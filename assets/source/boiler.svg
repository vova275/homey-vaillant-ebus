<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 270">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ea"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4550"/>
      <stop offset="1" stop-color="#232a31"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f6fff"/>
      <stop offset="0.55" stop-color="#36b5ff"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fd3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- pipes -->
  <g stroke="#9aa6b2" stroke-width="7" stroke-linecap="round">
    <line x1="52" y1="236" x2="52" y2="262"/>
    <line x1="78" y1="236" x2="78" y2="262"/>
    <line x1="100" y1="236" x2="100" y2="262"/>
    <line x1="122" y1="236" x2="122" y2="262"/>
    <line x1="148" y1="236" x2="148" y2="262"/>
  </g>
  <g stroke="#c9822b" stroke-width="7" stroke-linecap="round">
    <line x1="78" y1="250" x2="78" y2="262"/>
  </g>
  <!-- casing -->
  <rect x="20" y="8" width="160" height="232" rx="18" fill="url(#case)" filter="url(#sh)"/>
  <rect x="20" y="8" width="160" height="232" rx="18" fill="none" stroke="#c8d1d9" stroke-width="1.5"/>
  <!-- vent slots -->
  <g stroke="#cfd7de" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="28" x2="140" y2="28"/>
    <line x1="60" y1="37" x2="140" y2="37"/>
  </g>
  <!-- flame window -->
  <circle cx="100" cy="98" r="40" fill="url(#glow)"/>
  <circle cx="100" cy="98" r="27" fill="#eef3f7" stroke="#cfd7de" stroke-width="2"/>
  <path d="M100 76c4 9 14 13 14 25a14 14 0 0 1-28 0c0-6 3.5-10 6.5-13.5 1 3.4 3.2 5.4 3.2 7.6 2.6-6.8 4.3-12.6 4.3-19.1z" fill="url(#flame)"/>
  <!-- control panel -->
  <rect x="36" y="160" width="128" height="58" rx="10" fill="url(#panel)"/>
  <rect x="48" y="171" width="58" height="34" rx="5" fill="#0f1418"/>
  <text x="77" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#5fe0c8" text-anchor="middle">38°</text>
  <circle cx="126" cy="180" r="6" fill="#56636f"/>
  <circle cx="146" cy="180" r="6" fill="#56636f"/>
  <circle cx="126" cy="198" r="6" fill="#56636f"/>
  <circle cx="146" cy="198" r="6" fill="#00b39b"/>
</svg>
